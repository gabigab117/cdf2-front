name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Quality, tests and build
    runs-on: ubuntu-24.04
    # A newer push supersedes the checks of an older one. The deployment, which
    # must never be cut off midway, has its own group below.
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # The server compiles nothing: the deployment ships this exact build.
      - name: Package the build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf output.tar.gz -C .output .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: output.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

  # The API types are generated from the back end's schema, never written by
  # hand: those committed here must match the schema on the back end's main.
  api-types:
    name: API types match the back end's schema
    runs-on: ubuntu-24.04
    concurrency:
      group: api-types-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the back end's schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gabigab117/cdf2-back
          path: cdf2-back
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare the types with the schema
        env:
          API_SCHEMA: cdf2-back/openapi.json
        run: |
          npm run api:types -- --check || {
            echo "::error file=app/types/api.d.ts::The API types do not match the back end's schema: run npm run api:types and commit the result."
            exit 1
          }

  # The critical journeys, in a real browser, against the back end's main: the
  # front end in development mode, as its proxy serves the API on its own origin.
  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-24.04
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cdf2
          POSTGRES_USER: cdf2
          POSTGRES_PASSWORD: cdf2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdf2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_BACK_DIR: cdf2-back
      SECRET_KEY: e2e-throwaway-key-not-used-anywhere-else
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: cdf2
      POSTGRES_USER: cdf2
      POSTGRES_PASSWORD: cdf2
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the back end
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gabigab117/cdf2-back
          path: cdf2-back
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: cdf2-back
          enable-cache: true

      - name: Install the back end
        working-directory: cdf2-back
        run: uv sync --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npm run test:e2e

      # Fictitious data only, on a database that dies with the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to preproduction
    needs: [checks, api-types, e2e]
    # Only a commit pushed to main is deployed, never a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: preprod
    # One deployment at a time, never cancelled. A newer pending deployment
    # replaces an older one.
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: output.tar.gz

      # The key only runs the release script on the server, which takes the
      # commit SHA as its single argument and the build on its input. It
      # answers with one status line, as the logs of this run are public.
      - name: Deploy the tested build
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA" < output.tar.gz
